[tool.poetry]
name = "ako-wall-designer-agent"
version = "1.0.0"
description = "面向装配式围墙设计的AI智能体 - 从设计条件输入到效果图渲染的全链路自动化设计"
authors = ["AKO Design Lab"]
readme = "README.md"
packages = [{include = "src"}]
python = ">=3.11,<4.0"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
langgraph = ">=0.2.0"
gradio = "^4.0"
cadquery = "^2.4"
numpy = "^1.26"
scipy = "^1.11"
openai = "^1.0"
anthropic = "^0.30"
diffusers = "^0.28"
transformers = "^4.40"
accelerate = "^0.30"
opencv-python = "^4.9"
pillow = "^10.3"
safetensors = "^0.4"
torch = "^2.3"
python-dotenv = "^1.0"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.4"
black = "^24.0"
mypy = "^1.10"
memory-profiler = "^0.61"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"